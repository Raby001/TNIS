services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: metrorin-postgres
    
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: metrorin

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  pgadmin:
    image: dpage/pgadmin4
    container_name: metrorin-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5051:80"
    
    depends_on:
      - postgres
    
volumes:
  postgres_data:
    external: true
    name: metrorin-backend_postgres_data