services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: tnis-local-postgres
    
    environment:
      POSTGRES_USER: tnis_user
      POSTGRES_PASSWORD: tnis_password
      POSTGRES_DB: tnis_server_copy
      # POSTGRES_DB: tnis_db

    ports:
      - "5431:5432"

    volumes:
      - tnis_local_data:/var/lib/postgresql/data
    
  pgadmin:
    image: dpage/pgadmin4
    container_name: tnis_local_pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5049:80"
    
    depends_on:
      - postgres
    
volumes:
  tnis_local_data:
    name: tnis-local-postgres-data